name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pin to go.mod — `stable` can jump ahead of golangci-lint's build Go.
          go-version-file: go.mod

      # Windows has no mise here, and the task is one command either way.
      - name: Run tests
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # mise.toml pins Go, golangci-lint, and deadcode, so CI and a developer
      # laptop run the same versions of the same tasks.
      - name: Set up mise
        uses: jdx/mise-action@v4

      # fmt-check, lint, deadcode, and test, defined once in mise.toml.
      - name: Check
        run: mise run check
