# Pins the toolchain and the same tasks as the Makefile.
#   mise install
#   mise run check

[tools]
go = "1.26.3"
golangci-lint = "2.13.0"
"go:golang.org/x/tools/cmd/deadcode" = "latest"

[env]
CGO_ENABLED = "0"

[tasks.build]
description = "Build ./alpha (CGO off, stripped)"
run = "go build -ldflags='-s -w' -o alpha ./cmd"

[tasks.install]
description = "Build and install alpha into GOBIN"
depends = ["build"]
run = '''
set -euo pipefail
bin="$(go env GOBIN)"
[ -n "$bin" ] || bin="$(go env GOPATH)/bin"
mkdir -p "$bin"
mv -f alpha "$bin/alpha"
echo "installed alpha -> $bin/alpha"
'''

[tasks.run]
description = "Build and start the TUI"
depends = ["build"]
run = "./alpha"

[tasks.clean]
description = "Remove the local binary and Go cache artifacts"
run = ["rm -f alpha", "go clean"]

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."

[tasks.fmt]
description = "Apply gofumpt / goimports / golines via golangci-lint"
run = "golangci-lint fmt ./..."

[tasks."fmt-check"]
description = "Fail if formatting would change files (CI gate)"
run = "golangci-lint fmt --diff ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.deadcode]
description = "Report unreachable functions; fail on new ones"
run = "./scripts/deadcode.sh"

[tasks."deadcode-update"]
description = "Rewrite the dead-code baseline after deleting code"
run = "./scripts/deadcode.sh --update"

[tasks.tidy]
description = "Tidy go.mod / go.sum"
run = "go mod tidy"

[tasks.check]
description = "Local CI gate: format, lint, dead code, tests"
depends = ["fmt-check", "lint", "deadcode", "test"]
